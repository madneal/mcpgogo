steps:
  - id: go-sast
    name: asia-southeast1-docker.pkg.dev/project-679fd931-e097-4add-a8e/security-gate/go-sast:153d312
    args:
      - --path
      - /workspace
      - --fail-on-findings

  - id: gofmt
    name: golang:1.25-bookworm
    waitFor:
      - go-sast
    entrypoint: bash
    args:
      - -ceu
      - |
        files=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)
        test -z "$files"

  - id: test
    name: golang:1.25-bookworm
    waitFor:
      - gofmt
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go test $packages

  - id: build
    name: golang:1.25-bookworm
    waitFor:
      - test
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go build $packages

options:
  logging: CLOUD_LOGGING_ONLY
