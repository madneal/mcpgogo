substitutions:
  _TAG: latest

steps:
  - id: go-sast
    name: asia-southeast1-docker.pkg.dev/project-679fd931-e097-4add-a8e/security-gate/go-sast:153d312
    args:
      - --path
      - /workspace
      - --fail-on-findings

  - id: gofmt
    name: golang:1.25-bookworm
    waitFor:
      - go-sast
    entrypoint: bash
    args:
      - -ceu
      - |
        files=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)
        test -z "$files"

  - id: test
    name: golang:1.25-bookworm
    waitFor:
      - gofmt
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go test $packages

  - id: build
    name: golang:1.25-bookworm
    waitFor:
      - test
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go build $packages

  - id: container-build
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build
    args:
      - build
      - -t
      - asia-southeast1-docker.pkg.dev/project-679fd931-e097-4add-a8e/security-gate/mcpgogo:${_TAG}
      - .

  - id: container-push
    name: gcr.io/cloud-builders/docker
    waitFor:
      - container-build
    args:
      - push
      - asia-southeast1-docker.pkg.dev/project-679fd931-e097-4add-a8e/security-gate/mcpgogo:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - asia-southeast1-docker.pkg.dev/project-679fd931-e097-4add-a8e/security-gate/mcpgogo:${_TAG}
