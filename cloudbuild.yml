substitutions:
  _TAG: latest

steps:
  - id: go-sast
    name: asia-southeast1-docker.pkg.dev/${PROJECT_ID}/security-gate/go-sast:153d312
    args:
      - --path
      - /workspace
      - --fail-on-findings

  - id: gofmt
    name: golang:1.25-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        files=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)
        test -z "$files"

  - id: test
    name: golang:1.25-bookworm
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go test $packages

  - id: build
    name: golang:1.25-bookworm
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go build $packages

  - id: container-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-southeast1-docker.pkg.dev/${PROJECT_ID}/security-gate/mcpgogo:${_TAG}
      - .

  - id: container-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-southeast1-docker.pkg.dev/${PROJECT_ID}/security-gate/mcpgogo:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor:
      - container-push
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mcpgogo
      - --image=asia-southeast1-docker.pkg.dev/${PROJECT_ID}/security-gate/mcpgogo:${_TAG}
      - --region=asia-southeast1
      - --no-allow-unauthenticated

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - asia-southeast1-docker.pkg.dev/${PROJECT_ID}/security-gate/mcpgogo:${_TAG}
