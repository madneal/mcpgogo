steps:
  - id: fetch-go-sast
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone https://github.com/madneal/go-sast.git /workspace/go-sast
        git -C /workspace/go-sast checkout 153d312

  - id: go-sast
    name: golang:1.24-bookworm
    waitFor:
      - fetch-go-sast
    entrypoint: bash
    args:
      - -ceu
      - go run /workspace/go-sast --path /workspace --fail-on-findings

  - id: gofmt
    name: golang:1.24-bookworm
    waitFor:
      - go-sast
    entrypoint: bash
    args:
      - -ceu
      - |
        files=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 -r gofmt -l)
        test -z "$files"

  - id: test
    name: golang:1.24-bookworm
    waitFor:
      - gofmt
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go test $packages

  - id: build
    name: golang:1.24-bookworm
    waitFor:
      - test
    args:
      - bash
      - -ceu
      - |
        packages=$(go list ./... 2>/dev/null || true)
        test -z "$packages" || go build $packages

options:
  logging: CLOUD_LOGGING_ONLY
